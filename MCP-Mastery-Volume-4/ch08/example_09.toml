[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-enterprise-database"
version = "1.0.0"
description = "Production Model Context Protocol Database Gateway for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Enterprise Engineering", email = "oss@corp.internal" }
]
keywords = ["mcp", "model-context-protocol", "database", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "sqlparse>=0.5.0",
]

[project.scripts]
mcp-db = "mcp_enterprise_database.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_enterprise_database"]
