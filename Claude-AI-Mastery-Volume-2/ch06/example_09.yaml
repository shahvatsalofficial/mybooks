# Recipe 06.4: Production Kubernetes Deployment Manifest for FastMCP
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-mcp-server
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: fastmcp-server
    app.kubernetes.io/part-of: claude-copilot-infrastructure
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fastmcp-server
  template:
    metadata:
      labels:
        app: fastmcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: mcp-server
          image: internal-registry.enterprise.org/mcp/finrisk-server:2.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: sse-http
          env:
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-credentials
                  key: auth-token
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-credentials
                  key: db-dsn
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-mcp-service
  namespace: ai-platform
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: sse-http
  selector:
    app: fastmcp-server
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-mcp-hpa
  namespace: ai-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-mcp-server
  minReplicas: 4
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
