version: 0.0
Resources:
  - TargetService:
      Type: AWS::ECS::Service
      Properties:
        TaskDefinition: "arn:aws:ecs:us-east-1:112233445566:task-definition/payment-api:42"
        LoadBalancerInfo:
          ContainerName: "payment-container"
          ContainerPort: 8080
        CapacityProviderStrategy:
          - Base: 2
            CapacityProvider: "FARGATE"
            Weight: 1
          - Base: 0
            CapacityProvider: "FARGATE_SPOT"
            Weight: 3
Hooks:
  - BeforeInstall: "arn:aws:lambda:us-east-1:112233445566:function:PreDeploymentDbMigrationHook"
  - AfterInstall: "arn:aws:lambda:us-east-1:112233445566:function:WarmupCacheHook"
  - AfterAllowTestTraffic: "arn:aws:lambda:us-east-1:112233445566:function:SyntheticIntegrationTestHook"
  - BeforeAllowTraffic: "arn:aws:lambda:us-east-1:112233445566:function:SecurityScanVerificationHook"
  - AfterAllowTraffic: "arn:aws:lambda:us-east-1:112233445566:function:PostDeploymentSanityHook"
