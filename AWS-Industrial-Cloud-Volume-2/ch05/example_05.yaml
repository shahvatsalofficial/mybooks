# amp-alerting-rules.yaml
groups:
  - name: industrial-payment-service-alerts
    rules:
      - alert: HighHttp5xxErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[2m])) by (service, namespace)
          /
          sum(rate(http_requests_total[2m])) by (service, namespace)
          * 100 > 2.0
        for: 1m
        labels:
          severity: critical
          tier: payment
        annotations:
          summary: "High HTTP 5xx error rate on service {{ $labels.service }}"
          description: "Service {{ $labels.service }} in namespace {{ $labels.namespace }} has a 5xx error rate of {{ $value | printf "%.2f" }}% over the last 2 minutes."

      - alert: P99LatencyBreach
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P99 Latency exceeded 1500ms on {{ $labels.service }}"
