# adot-collector-daemonset.yaml
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: adot-collector
  namespace: opentelemetry-system
spec:
  mode: daemonset
  image: public.ecr.aws/aws-observability/aws-otel-collector:v0.38.0
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: 'kubernetes-service-endpoints'
              kubernetes_sd_configs:
                - role: endpoints

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        send_batch_size: 512
        timeout: 1s
      resourcedetection:
        detectors: [env, eks, ec2]
        timeout: 2s

    exporters:
      awsxray:
        region: us-east-1
      prometheusremotewrite:
        endpoint: https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-1122-3344/api/v1/remote_write
        auth:
          authenticator: sigv4auth
      aws_emf:
        region: us-east-1
        log_group_name: "/aws/eks/industrial-cluster/otel-metrics"

    extensions:
      sigv4auth:
        region: us-east-1
        service: aps

    service:
      extensions: [sigv4auth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [awsxray]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [prometheusremotewrite, aws_emf]
