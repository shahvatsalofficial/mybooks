# /etc/sysctl.d/99-ai-gateway.conf — Low-Latency Ingress Tuning

# Increase system-wide maximum open file descriptors
fs.file-max = 2097152

# Increase maximum socket listen backlog for burst connections
net.core.somaxconn = 65535

# Increase maximum incoming socket queue
net.core.netdev_max_backlog = 65535

# Enable TCP BBR Congestion Control (replaces loss-intolerant Cubic)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP Read Buffer Sizes: Min (4KB), Default (87KB), Max (16MB)
# Accommodates 128k token context windows without buffer drops
net.ipv4.tcp_rmem = 4096 87380 16777216

# TCP Write Buffer Sizes: Min (4KB), Default (65KB), Max (16MB)
net.ipv4.tcp_wmem = 4096 65536 16777216

# Disable TCP slow start after idle to maintain full transmission rate
net.ipv4.tcp_slow_start_after_idle = 0

# Reuse TIME_WAIT sockets for outgoing connections
net.ipv4.tcp_tw_reuse = 1

# Reduce FIN timeout to free abandoned connection sockets rapidly
net.ipv4.tcp_fin_timeout = 15

# Keepalive Probes: Send keepalive every 30s, 3 probes, 5s interval
# Rapidly detects dead client sockets during long-running streaming inference
net.ipv4.tcp_keepalive_time = 30
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_keepalive_intvl = 5
