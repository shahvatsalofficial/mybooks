name: Production Prompt Regression Suite

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'schemas/**'
  push:
    branches:
      - main

jobs:
  evaluate-prompts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install anthropic pytest pydantic jsonschema

      - name: Execute Prompt Regression Evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pytest tests/test_prompts.py -v --junitxml=reports/prompt_results.xml

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: prompt-test-results
          path: reports/prompt_results.xml
