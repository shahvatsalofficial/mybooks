name: Claude Triage PR Gate
on:
  pull_request:
    paths:
      - "src/triage/**"

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run headless Claude Code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/main...HEAD > pr_diff.patch
          claude -p "Review pr_diff.patch for unhandled exceptions, SQL injection, or missing schema validation. Return JSON only." \
            --output-format json \
            --max-turns 5 \
            --allowedTools "Read,Grep" \
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"findings":{"type":"array","items":{"type":"string"}}},"required":["blocking","findings"]}' \
            > claude_review.json
          python scripts/ci_review_gate.py claude_review.json
