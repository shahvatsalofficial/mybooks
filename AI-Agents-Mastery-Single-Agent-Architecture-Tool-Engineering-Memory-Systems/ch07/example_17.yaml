# GitHub Actions CI AgentBench Gating Workflow
name: AgentBench Regression Gate
on: [pull_request]
jobs:
  agent-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Execute Parallel AgentBench Suite
        run: |
          pip install pytest pytest-xdist pydantic
          pytest tests/eval/ -n 4 --maxfail=1 --threshold-tsr=0.95
