### 8.2 Scenario 2: The Malicious Cron Webhook Infiltration
**Context**: Your enterprise runs a headless cron worker that queries public GitHub issues across your open-source libraries every morning, attempting to reproduce user bug reports in an automated cleanroom.

**The Attack**: An attacker opens an issue titled *”Memory leak in parser”* and writes a prompt injection inside the issue description that instructs the agent to clone an external git repository and push internal credentials to a public gist.

**Architectural Drill Questions**:
1. Why is headless execution uniquely vulnerable to unauthenticated public issue ingestion?
2. How do you design an ingestion boundary that sanitizes the issue text before passing it to the headless runner?
3. What git credential scoping policies ensure that an unattended agent cannot push code to unauthorized repositories?

**Strategic Solution**:
* **Dual-LLM Airgap Ingestion**: The public issue text is parsed by an unprivileged Ingestion LLM running in a zero-network sandbox. The Ingestion LLM emits only sanitized reproduction test code, completely stripping conversational directives.
* **Fine-Grained GitHub App Scoping**: The headless runner authenticates using an installation access token scoped strictly to `issues: read` and `pull_requests: write` on the specific target repository. The token has zero permissions to create gists, modify organization settings, or access private repositories.
* **Egress Firewall Block**: The cleanroom’s outbound firewall drops all connections to `gist.github.com` and arbitrary external git remotes.

