livenessProbe:
    exec:
      command:
      - /bin/sh
      - -c
      - "[ $(($(date +%s) - $(cat /tmp/heartbeat_timestamp))) -lt 45 ]"
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 2
  ```
  If the agent fails to touch `/tmp/heartbeat_timestamp` within 45 seconds, the kubelet sends an immediate `SIGKILL` to the container.

