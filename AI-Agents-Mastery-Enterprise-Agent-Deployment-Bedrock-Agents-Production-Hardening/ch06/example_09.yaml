apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: agent-worker-scaler
  namespace: agent-runtime
spec:
  scaleTargetRef:
    name: autonomous-agent-worker-deployment
  minReplicaCount: 2
  maxReplicaCount: 100
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: rabbitmq
      metadata:
        queueName: agent_mission_queue
        mode: QueueLength
        value: "5" # Spin up 1 worker pod for every 5 pending missions
      authenticationRef:
        name: keda-rabbitmq-auth
